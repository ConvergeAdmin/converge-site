<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join the Waitlist | Converge</title>

<link rel="stylesheet" href="css/styles.css">

<style>

body{
background:#f6f6f4;
font-family:'Cormorant Garamond', serif;
text-align:left;
padding:90px 20px;
}

.container{
max-width:680px;
margin-left:60px;
}

h1{
font-size:64px;
line-height:0.95;
font-weight:300;
max-width:520px;
margin:0 0 28px 0;
}

p{
font-size:15px;
line-height:1.9;
max-width:520px;
margin:0 0 32px 0;
color:#5f6470;
}

input{
width:100%;
padding:14px;
margin-bottom:16px;
border:1px solid #ddd;
font-size:16px;
}

button{
background:#111;
color:white;
padding:14px 30px;
border:none;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#333;
}

</style>

</head>

<body>

<div class="container hero-inner" style="padding-top: 80px;">

<p class="hero-eyebrow fade-up">CONVERGE</p>

<h1 style="font-size:56px; line-height:1.02; font-weight:300; max-width:520px;">
  Join the waitlist.
</h1>

<p style="font-size:17px; line-height:1.8; max-width:430px; color:#5f6470;">
  Converge is building a new framework for intentional partnership.
  <br><br>
  A limited number of applicants will be accepted to the inaugural cohort. Share your name and email below, and we'll be in touch as application opens.
</p>

<div style="max-width: 520px; margin-top: 4rem;">

<form name="waitlist" method="POST" data-netlify="true" action="/thank-you.html">

<input type="hidden" name="form-name" value="waitlist">

<input type="text" name="name" placeholder="Your name" required>

<input type="email" name="email" placeholder="Your email address" required>

<button type="submit">Join the Waitlist </button>

</form>
</div>

</div>

</body>
</html>

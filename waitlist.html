<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join the Waitlist | Converge</title>

<link rel="stylesheet" href="css/styles.css">

<style>

body{
background:#f6f6f4;
font-family:'Cormorant Garamond', serif;
text-align:center;
padding:120px 20px;
}

.container{
max-width:600px;
margin:auto;
}

h1{
font-size:40px;
margin-bottom:10px;
}

p{
font-size:18px;
margin-bottom:40px;
color:#555;
}

input{
width:100%;
padding:14px;
margin-bottom:16px;
border:1px solid #ddd;
font-size:16px;
}

button{
background:#111;
color:white;
padding:14px 30px;
border:none;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#333;
}

</style>

</head>

<body>

<div class="container" style="padding-top: 60px; max-width: 760px;">

<p class="hero-eyebrow fade-up">FOUNDING COHORT</p>

<h1 class="hero-headline fade-up" style="font-size: clamp(56px, 8vw, 88px); line-height: 0.95;">
  Be part of the founding cohort.
</h1>

<p class="hero-sub fade-up serif" style="max-width: 640px; margin: 2.5rem auto;">
  Converge is building a new framework for intentional partnership.
  <br><br>
  Something meaningful is taking shape here. We’re intentionally curating the founding cohort and will be in touch as early invitations begin rolling out.
</p>

<div style="margin-top: 4rem;">

<form name="waitlist" method="POST" data-netlify="true" action="/thank-you.html">

<input type="hidden" name="form-name" value="waitlist">

<input type="text" name="name" placeholder="Your name" required>

<input type="email" name="email" placeholder="Your email address" required>

<button type="submit">Join the Waitlist </button>

</form>
</div>

</div>

</body>
</html>
